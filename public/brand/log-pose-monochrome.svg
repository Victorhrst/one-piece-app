<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Grand Line — Log Pose monochrome</title>
  <defs><mask id="silhouette" x="0" y="0" width="64" height="64" maskUnits="userSpaceOnUse" style="mask-type:luminance"><g fill="none">  <g transform="rotate(8 32 32)">
    <!-- Rear pillar stays behind the glass. -->
    <path d="M47 15v37" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M44.5 21h5M44.5 46h5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Glass globe: an open interior keeps the instrument legible at 38 px. -->
    <circle cx="32" cy="34" r="19.5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <path d="M39.8 18.4a17.4 17.4 0 0 1 7.8 10.2" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="48.2" cy="33.4" r="1.3" fill="#ffffff"/>

    <!-- Suspension shaft and split compass needle. -->
    <path d="M32 22.5v24" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round"/>
    <ellipse cx="32" cy="22" rx="3.3" ry="1.6" stroke="#ffffff" stroke-width="1.5"/>
    <path d="m17 42 13-12 4 8-17 4Z" fill="#ffffff" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="m47 26-13 12-4-8 17-4Z" fill="#ffffff" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="32" cy="34" r="1.6" fill="#000000"/>

    <!-- Front pillar, with one collar instead of wood-grain detail. -->
    <path d="M18 15c-1.3 5.8-2 11.7-2 18s.7 12.2 2 18" stroke="#ffffff" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M13.8 32h4.6" stroke="#000000" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Elliptical caps give the Log Pose its distinctive silhouette. -->
    <path d="M10 8v4c0 3.1 9.8 5.6 22 5.6s22-2.5 22-5.6V8H10Z" fill="#ffffff"/>
    <ellipse cx="32" cy="8" rx="22" ry="5" fill="#ffffff"/>
    <path d="M15 9.6c9.3 2.6 24.7 2.6 34 0" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M9.5 54v3.5C9.5 60.3 19.6 62.5 32 62.5s22.5-2.2 22.5-5V54h-45Z" fill="#ffffff"/>
    <ellipse cx="32" cy="54" rx="22.5" ry="5" fill="#ffffff"/>
    <path d="M15 55.6c9.3 2.6 24.7 2.6 34 0" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</g></mask></defs>
  <path d="M0 0h64v64H0z" fill="#0b1120" mask="url(#silhouette)"/>
</svg>
